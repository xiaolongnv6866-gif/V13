name: V13 R044 Wanming independent principle extractor
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  r044:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: R044 principle extraction source and independent task audit
        run: python3 scripts/validate_r044_principle_extractor.py
      - name: Frozen 89-round controller
        run: python3 scripts/validate_round_integrity.py
