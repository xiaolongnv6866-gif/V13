name: V13 R038 Wanming Adler critical and applicability evidence integrity
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  r038:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Adler R038 source-anchored critique and executable fiction task audit
        run: python3 scripts/validate_r038_critique.py
      - name: Frozen 89 round controller
        run: python3 scripts/validate_round_integrity.py
