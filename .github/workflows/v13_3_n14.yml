name: V13.3 N14 original R022 literature and R042
on:
  push:
    branches: [main]
    paths:
      - 'v13_3/n14/**'
      - 'runs/N14_V4.md'
      - 'V13_CURRENT_V4.json'
      - 'V13_LEDGER_V4.tsv'
      - 'scripts/validate_v13_n14.py'
      - '.github/workflows/v13_3_n14.yml'
  workflow_dispatch:
jobs:
  n14-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original N14 ID, evidence and old isolation checks (structural)
        run: python3 scripts/validate_v13_n14.py
