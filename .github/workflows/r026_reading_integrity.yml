name: V13 R026 TiexueCanming 361-400 original narrative integrity
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  r026:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Frozen R006 original reading receipt contract
        run: python3 scripts/validate_r006_protocol.py --receipts cangjie/reading/R026/tiexue_receipts.jsonl
      - name: R026 source-member and distinct literary evidence audit
        run: python3 scripts/validate_r026_reading.py
      - name: Full V13 89-round integrity and sealed test gate
        run: python3 scripts/validate_round_integrity.py
