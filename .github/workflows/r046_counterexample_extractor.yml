name: V13 R046 Wanming independent counterexample extractor
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  r046:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: R046 original-source failure-mode and warning boundary audit
        run: python3 scripts/validate_r046_counterexample_extractor.py
      - name: Frozen 89-round controller
        run: python3 scripts/validate_round_integrity.py
