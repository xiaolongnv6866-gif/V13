name: V13.3 N06 source reviews and historical quarantine
on:
  push:
    branches: [main]
    paths:
      - 'v13_3/n06/**'
      - 'runs/N06_V4.md'
      - 'V13_CURRENT_V4.json'
      - 'V13_LEDGER_V4.tsv'
      - 'scripts/validate_v13_n06.py'
      - '.github/workflows/v13_3_n06.yml'
  workflow_dispatch:
jobs:
  n06-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate original literary evidence and quarantine (structural)
        run: python3 scripts/validate_v13_n06.py
