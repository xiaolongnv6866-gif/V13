name: V13.3 N13 original R020 literature and R042
on:
  push:
    branches: [main]
    paths:
      - 'v13_3/n13/**'
      - 'runs/N13_V4.md'
      - 'V13_CURRENT_V4.json'
      - 'V13_LEDGER_V4.tsv'
      - 'scripts/validate_v13_n13.py'
      - '.github/workflows/v13_3_n13.yml'
  workflow_dispatch:
jobs:
  n13-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original N13 ID, evidence and old isolation checks (structural)
        run: python3 scripts/validate_v13_n13.py
