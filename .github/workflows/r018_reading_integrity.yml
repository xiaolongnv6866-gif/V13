name: V13 R018 Tiexue 201-240 original literary evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  r018:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Frozen R006 original literary full-text receipts contract
        run: python3 scripts/validate_r006_protocol.py --receipts cangjie/reading/R018/tiexue_receipts.jsonl
      - name: R018 source index and private-SHA-locator public structural validation
        run: python3 scripts/validate_r018_reading.py
      - name: V13 89-round controller
        run: python3 scripts/validate_round_integrity.py
