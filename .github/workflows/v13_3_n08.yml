name: V13.3 N08 original R023 literature and R042
on:
  push:
    branches: [main]
    paths:
      - 'v13_3/n08/**'
      - 'runs/N08_V4.md'
      - 'V13_CURRENT_V4.json'
      - 'V13_LEDGER_V4.tsv'
      - 'scripts/validate_v13_n08.py'
      - '.github/workflows/v13_3_n08.yml'
  workflow_dispatch:
jobs:
  n08-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original N08 ID, evidence and old isolation checks (structural)
        run: python3 scripts/validate_v13_n08.py
