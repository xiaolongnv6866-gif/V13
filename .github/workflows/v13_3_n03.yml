name: V13.3 N03 original source literary B and R042
on:
  push:
    branches: [main]
    paths:
      - 'v13_3/n03/**'
      - 'runs/N03_V4.md'
      - 'V13_CURRENT_V4.json'
      - 'V13_LEDGER_V4.tsv'
      - 'scripts/validate_v13_n03.py'
      - '.github/workflows/v13_3_n03.yml'
  workflow_dispatch:
jobs:
  n03-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: N03 structural source checks, not semantic certification
        run: python3 scripts/validate_v13_n03.py
