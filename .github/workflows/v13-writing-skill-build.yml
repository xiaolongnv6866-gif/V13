name: V13 finished writing skill - runnable structure only
on:
  push:
    paths:
      - 'skills/v13-history-military/**'
      - '.github/workflows/v13-writing-skill-build.yml'
  workflow_dispatch:

jobs:
  compile-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned original Cangjie compiler, not a rewritten substitute
        run: |
          git clone --quiet https://github.com/kangarooking/cangjie-skill.git /tmp/v13-pinned-cangjie
          git -C /tmp/v13-pinned-cangjie checkout --quiet --detach a28de55ba881b9928956a55048f743f7a9e3b23e
          test "$(git -C /tmp/v13-pinned-cangjie rev-parse HEAD)" = "a28de55ba881b9928956a55048f743f7a9e3b23e"
      - name: Prepare user-waived non-V3 Cangjie protocol bundle
        run: |
          python -m pip install --quiet pyyaml jsonschema
          python skills/v13-history-military/scripts/build_cangjie_adapter.py --out /tmp/v13-cangjie-bundle
      - name: Run ORIGINAL Cangjie single compiler and record actual exit code
        run: |
          set +e
          python /tmp/v13-pinned-cangjie/scripts/cangjie.py compile --bundle /tmp/v13-cangjie-bundle --out /tmp/v13-cangjie-dist --output single > /tmp/v13-original-compile.log 2>&1
          rc=$?
          printf 'cangjie_original_compiler_exit=%s\\nindependent_v3=NOT_RUN_USER_WAIVED\\n' "$rc" > /tmp/v13-original-compile-status.txt
          cat /tmp/v13-original-compile.log
          exit "$rc"
      - name: Run ORIGINAL Cangjie pack compiler and independent original pack validator
        run: |
          python /tmp/v13-pinned-cangjie/scripts/cangjie.py compile --bundle /tmp/v13-cangjie-bundle --out /tmp/v13-cangjie-pack-dist --output pack > /tmp/v13-original-pack-compile.log 2>&1
          cat /tmp/v13-original-pack-compile.log
          python /tmp/v13-pinned-cangjie/scripts/validate_skill_pack.py /tmp/v13-cangjie-dist /tmp/v13-cangjie-pack-dist > /tmp/v13-original-validator.log 2>&1
          cat /tmp/v13-original-validator.log
          printf 'single_and_pack_compilers_exit=0\\noriginal_validator_exit=0\\nuser_waived_independent_V3=NOT_RUN_USER_WAIVED\\n' > /tmp/v13-original-both-compile-status.txt
      - name: Upload original compiler evidence and draft single output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-pinned-cangjie-original-compile-evidence
          path: |
            /tmp/v13-cangjie-bundle/BUILD_ONLY_ADAPTER_STATUS.json
            /tmp/v13-original-compile.log
            /tmp/v13-original-compile-status.txt
            /tmp/v13-cangjie-dist/**
            /tmp/v13-cangjie-pack-dist/**
            /tmp/v13-original-pack-compile.log
            /tmp/v13-original-validator.log
            /tmp/v13-original-both-compile-status.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Run complete fictional-state regression suite
        run: python -m unittest discover -s skills/v13-history-military/tests -p 'test_*.py' -v
      - name: Check original ledger continuity
        run: python skills/v13-history-military/scripts/validate_state.py skills/v13-history-military/fixtures/chaoxun_ch05.json
      - name: Check complete packaging inventory
        run: python skills/v13-history-military/scripts/build_release.py --check
      - name: Test cross-chat resume and package ZIP
        run: |
          python skills/v13-history-military/scripts/build_handoff.py --out /tmp/V13_HANDOFF.md
          python skills/v13-history-military/scripts/build_release.py --out /tmp/V13_HISTORY_MILITARY_SKILL.zip
          test -s /tmp/V13_HANDOFF.md
          test -s /tmp/V13_HISTORY_MILITARY_SKILL.zip
      - name: Preserve self-contained package as downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: v13-history-military-writing-skill
          path: /tmp/V13_HISTORY_MILITARY_SKILL.zip
          retention-days: 7
