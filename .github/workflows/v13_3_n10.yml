name: V13.3 N10 original R012 and R014 literature and R042
on:
  push:
    branches: [main]
    paths:
      - 'v13_3/n10/**'
      - 'runs/N10_V4.md'
      - 'V13_CURRENT_V4.json'
      - 'V13_LEDGER_V4.tsv'
      - 'scripts/validate_v13_n10.py'
      - '.github/workflows/v13_3_n10.yml'
  workflow_dispatch:
jobs:
  n10-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original N10 ID, evidence and old isolation checks (structural)
        run: python3 scripts/validate_v13_n10.py
