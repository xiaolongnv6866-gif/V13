name: V13 R048 Tiexue Stage1 independent framework extractor
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  r048:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: R048 source-structure and Stage0 task coverage
        run: python3 scripts/validate_r048_framework_extractor.py
      - name: Frozen V13 89-round controller
        run: python3 scripts/validate_round_integrity.py
