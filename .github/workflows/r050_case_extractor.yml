name: V13 R050 Tiexue Stage1 independent fictional case extractor
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  r050:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: R050 case SOURCE_STRUCTURE_ONLY validation
        run: python3 scripts/validate_r050_case_extractor.py
      - name: Frozen round integrity
        run: python3 scripts/validate_round_integrity.py
