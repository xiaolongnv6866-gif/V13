name: V13.3 N17 Wanming 91 V1 source and candidate status integrity
on:
  push:
    branches: [main]
    paths:
      - 'v13_3/n17/**'
      - 'scripts/validate_v13_n17.py'
      - 'scripts/verify_v13_n17_epub.py'
      - 'books/wanming/candidates/**'
      - 'V13_CURRENT_V4.json'
      - 'V13_LEDGER_V4.tsv'
      - 'runs/N17_V4.md'
      - '.github/workflows/v13_3_n17.yml'
  workflow_dispatch:
jobs:
  source-qualification-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V1 91-source decision matrix (public structural only)
        run: python3 scripts/validate_v13_n17.py
      - name: Confirm private source replay is clearly separate from public CI
        run: python3 -m py_compile scripts/verify_v13_n17_epub.py
