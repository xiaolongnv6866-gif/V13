name: V13.3 N01 17 Literary Source and R042 Contract
on:
  push:
    branches: [main]
    paths:
      - 'v13_3/n01/**'
      - 'runs/N01_V4.md'
      - 'V13_CURRENT_V4.json'
      - 'V13_LEDGER_V4.tsv'
      - 'scripts/validate_v13_n01.py'
      - '.github/workflows/v13_3_n01.yml'
  workflow_dispatch:
jobs:
  n01-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate N01 source and contract (structural only)
        run: python3 scripts/validate_v13_n01.py
