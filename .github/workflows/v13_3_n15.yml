name: V13.3 N15 original R024 literature B20 (R042 zero)
on:
  push:
    branches: [main]
    paths:
      - 'v13_3/n15/**'
      - 'runs/N15_V4.md'
      - 'V13_CURRENT_V4.json'
      - 'V13_LEDGER_V4.tsv'
      - 'scripts/validate_v13_n15.py'
      - '.github/workflows/v13_3_n15.yml'
  workflow_dispatch:
jobs:
  n15-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original N15 ID, evidence and zero-new-quarantine checks (structural)
        run: python3 scripts/validate_v13_n15.py
