name: V13.2 B069 actual paired output audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-b069-paired-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate original R069 and R070 exact paired outputs and scores
        run: python scripts/validate_v13_2_b069.py
