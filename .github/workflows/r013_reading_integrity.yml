name: V13 R013 Wanming literary source integrity
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  source-and-reading-receipts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Frozen R006 original reading source contract
        run: python3 scripts/validate_r006_protocol.py --receipts cangjie/reading/R013/wanming_receipts.jsonl
      - name: R013 chapter source and literary evidence
        run: python3 scripts/validate_r013_reading.py
      - name: 89-round repository integrity
        run: python3 scripts/validate_round_integrity.py
