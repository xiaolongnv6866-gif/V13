name: V13 R033 Wanming original 521-560 narrative integrity
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  r033:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Frozen R006 full narrative receipt schema
        run: python3 scripts/validate_r006_protocol.py --receipts cangjie/reading/R033/wanming_receipts.jsonl
      - name: R033 full chapter original index literary evidence (public structure only)
        run: python3 scripts/validate_r033_reading.py
      - name: 89-round controller
        run: python3 scripts/validate_round_integrity.py
