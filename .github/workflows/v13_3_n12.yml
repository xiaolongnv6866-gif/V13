name: V13.3 N12 original R018 literature and R042
on:
  push:
    branches: [main]
    paths:
      - 'v13_3/n12/**'
      - 'runs/N12_V4.md'
      - 'V13_CURRENT_V4.json'
      - 'V13_LEDGER_V4.tsv'
      - 'scripts/validate_v13_n12.py'
      - '.github/workflows/v13_3_n12.yml'
  workflow_dispatch:
jobs:
  n12-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original N12 ID, evidence and old isolation checks (structural)
        run: python3 scripts/validate_v13_n12.py
