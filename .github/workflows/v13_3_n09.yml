    branches: [main]
    paths:
      - 'v13_3/n09/**'
      - 'runs/N09_V4.md'
      - 'V13_CURRENT_V4.json'
      - 'V13_LEDGER_V4.tsv'
      - 'scripts/validate_v13_n09.py'
      - '.github/workflows/v13_3_n09.yml'
  workflow_dispatch:
jobs:
  n09-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original N09 ID, evidence and old isolation checks (structural)
        run: python3 scripts/validate_v13_n09.py
