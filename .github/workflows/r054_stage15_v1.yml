name: V13 R054 two-book original V1 source sufficiency audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  r054-v1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: V1 evidence decisions and original source chain (public structure only)
        run: python3 scripts/validate_r054_stage15_v1.py
      - name: Frozen V13 89 round gate
        run: python3 scripts/validate_round_integrity.py
