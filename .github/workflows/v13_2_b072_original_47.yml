name: V13.2 B072 original 47 paired diagnostics complete
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate-b072-original-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify R073 and R074 real output, and all original 47 diagnostics
        run: python scripts/validate_v13_2_b072.py
