name: V13 R045 Wanming independent case extractor
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  r045:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: R045 authentic scene, case-kind, source and task-coverage audit
        run: python3 scripts/validate_r045_case_extractor.py
      - name: Frozen V13 89-round integrity controller
        run: python3 scripts/validate_round_integrity.py
