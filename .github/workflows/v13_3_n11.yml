name: V13.3 N11 original R016 literature and R042
on:
  push:
    branches: [main]
    paths:
      - 'v13_3/n11/**'
      - 'runs/N11_V4.md'
      - 'V13_CURRENT_V4.json'
      - 'V13_LEDGER_V4.tsv'
      - 'scripts/validate_v13_n11.py'
      - '.github/workflows/v13_3_n11.yml'
  workflow_dispatch:
jobs:
  n11-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original N11 ID, evidence and old isolation checks (structural)
        run: python3 scripts/validate_v13_n11.py
