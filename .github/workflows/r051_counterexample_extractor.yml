name: V13 R051 Tiexue independent counterexample extractor
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  r051:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify R051 source-located counterexample candidate structure
        run: python3 scripts/validate_r051_counterexample_extractor.py
      - name: Verify frozen V13 89-round cursor
        run: python3 scripts/validate_round_integrity.py
